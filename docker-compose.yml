# ローカル開発用。db と api を起動する。
# フロント(web/)は HMR の速さを優先してホストで `npm run dev` する。
#
# 使い方:
#   docker compose up -d          … db と api を起動
#   docker compose exec api php artisan migrate
#   docker compose logs -f api
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: taskboard
      POSTGRES_USER: app
      POSTGRES_PASSWORD: password
    ports:
      # ホストの psql / GUI クライアントから覗けるように公開する
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      # テスト用 DB を作る。ボリュームが空のときだけ実行される
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # api が「DB がまだ受付前」の状態で起動しないようにする
      test: ["CMD-SHELL", "pg_isready -U app -d taskboard"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    volumes:
      - ./api:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    # php artisan serve はホストのスリープ後などに応答しなくなることがある。
    # Up のまま無反応になる状態を検知して復帰させる。
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  db-data:
